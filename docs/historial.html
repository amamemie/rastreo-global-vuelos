<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Historial de Vuelos | MongoDB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --bg: #f4f7f6; }
        body { background-color: var(--bg); font-family: 'Segoe UI', sans-serif; }
        .table-container { 
            background: white; 
            border-radius: 15px; 
            padding: 30px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
            margin-top: 2rem;
        }
        .icao-badge { 
            background: #e7f1ff; 
            color: #0d6efd; 
            font-family: monospace; 
            padding: 4px 8px; 
            border-radius: 6px; 
            font-weight: bold;
        }
        .navbar-custom { background: #1a1c23; padding: 1rem; }
    </style>
</head>
<body>

<nav class="navbar-custom shadow-sm mb-4">
    <div class="container d-flex justify-content-between align-items-center">
        <span class="text-white fs-4 fw-bold">✈️ Logistics<span class="text-primary">History</span></span>
        <a href="/" class="btn btn-outline-light btn-sm">📡 Volver al Radar</a>
    </div>
</nav>

<div class="container">
    <div class="table-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold m-0">📋 Registros Históricos</h3>
                <p class="text-muted small m-0">Mostrando los últimos 100 vuelos detectados en MongoDB</p>
            </div>
            <button onclick="cargarHistorial()" class="btn btn-primary btn-sm">🔄 Refrescar Tabla</button>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Fecha y Hora</th>
                        <th>ICAO24</th>
                        <th>Callsign (Vuelo)</th>
                        <th>País de Origen</th>
                        <th>Altitud</th>
                    </tr>
                </thead>
                <tbody id="tabla-cuerpo">
                    <tr>
                        <td colspan="5" class="text-center py-5">
                            <div class="spinner-border text-primary" role="status"></div>
                            <br><span class="text-muted mt-2 d-block">Consultando base de datos...</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    async function cargarHistorial() {
        const tbody = document.getElementById('tabla-cuerpo');
        
        try {
            const response = await fetch('/api/historial_datos');
            const datos = await response.json();

            if (datos.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">No hay datos registrados aún. Presiona "Actualizar" en el Radar.</td></tr>';
                return;
            }

            tbody.innerHTML = datos.map(v => `
                <tr>
                    <td class="text-muted small">${v.timestamp}</td>
                    <td><span class="icao-badge">${v.icao24}</span></td>
                    <td class="fw-bold">${v.callsign}</td>
                    <td>🌍 ${v.pais}</td>
                    <td>${v.altitud.toLocaleString()} m</td>
                </tr>
            `).join('');

        } catch (error) {
            console.error("Error:", error);
            tbody.innerHTML = '<tr><td colspan="5" class="text-center text-danger py-4">Error al conectar con el servidor.</td></tr>';
        }
    }

    // Carga inicial al abrir la página
    cargarHistorial();
</script>

</body>
</html>
