<!DOCTYPE html>
<html lang="es" data-theme="dark" data-static="1">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    /* Tema e idioma antes de pintar: sin parpadeo */
    (function () {
      var d = document.documentElement, t = null, l = null;
      try { t = localStorage.getItem('radar-theme'); l = localStorage.getItem('radar-lang'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      if (l !== 'es' && l !== 'en') l = /^es\b/i.test(navigator.language || '') ? 'es' : 'en';
      d.dataset.theme = t;
      if (l !== 'es') { d.lang = l; d.classList.add('i18n-pending'); setTimeout(function () { d.classList.remove('i18n-pending'); }, 1500); }
    })();
  </script>
  <meta name="theme-color" content="#06080b">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Rastreo en tiempo real del tráfico aéreo sobre Latinoamérica con datos de OpenSky Network. Real-time air traffic over Latin America.">
  <title data-i18n-key="hi.title">Historial · Radar Latam</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='11' fill='%2306080b' stroke='%23f5a524' stroke-width='1.5'/%3E%3Cpath d='M12 12L12 2A10 10 0 0 1 21 8z' fill='%23f5a524'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="static/css/app.css">
  
<style>
  .tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .tools .field { width: 290px; }
  .hist .table-wrap { max-height: calc(100dvh - 320px); min-height: 340px; }
  .foot { padding: 12px 20px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-3); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .table tbody tr { animation: row .45s var(--ease) both; }
  @keyframes row { from { opacity: 0; transform: translateY(6px); } }
  @media (max-width: 600px) {
    .tools, .tools .field { width: 100%; }
    .tools .btn { flex: 1; }
    .hist .table-wrap { max-height: none; }
  }
</style>

</head>
<body>
  <a class="skip-link" href="#main" data-i18n="skip">Saltar al contenido</a>

  <header class="topbar">
    <a class="brand" href="index.html" translate="no" data-i18n-aria="brand.aria" aria-label="Radar Latam, inicio">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="10.5" stroke="var(--line-strong)"/>
        <circle cx="12" cy="12" r="6" stroke="var(--line-strong)"/>
        <g class="sweep"><path d="M12 12L12 1.5A10.5 10.5 0 0 1 21.1 6.75z" fill="url(#sw)"/></g>
        <circle cx="12" cy="12" r="1.6" fill="var(--accent)"/>
        <defs><linearGradient id="sw" x1="12" y1="2" x2="20" y2="8" gradientUnits="userSpaceOnUse"><stop stop-color="#f5a524" stop-opacity=".9"/><stop offset="1" stop-color="#f5a524" stop-opacity="0"/></linearGradient></defs>
      </svg>
      Radar <span>Latam</span>
    </a>
    
    <nav class="nav" data-i18n-aria="nav.aria" aria-label="Secciones">
      <a href="index.html" data-i18n="nav.radar" >Radar en vivo</a>
      <a href="filtro_paises.html" data-i18n="nav.filtro" >Por país</a>
      <a href="estadisticas.html" data-i18n="nav.stats" >Estadísticas</a>
      <a href="historial.html" data-i18n="nav.hist" aria-current="page">Historial</a>
    </nav>
    <div class="tools-bar">
      <div class="live" aria-live="polite">
        <span id="live-dot" class="dot" aria-hidden="true"></span>
        <span id="live-text" data-i18n="live.connecting">Conectando…</span>
      </div>
      <div class="seg" role="group" data-i18n-aria="lang.aria" aria-label="Idioma">
        <button type="button" data-lang-btn="es" aria-pressed="true" lang="es">ES</button>
        <button type="button" data-lang-btn="en" aria-pressed="false" lang="en">EN</button>
      </div>
      <button type="button" id="theme-btn" class="icon-btn" aria-label="Cambiar tema">
        <svg class="i-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.2M12 19.8V22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M2 12h2.2M19.8 12H22M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"/></svg>
        <svg class="i-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z"/></svg>
      </button>
    </div>
  </header>

  
<main id="main" class="page">
  <div class="page-head" data-enter>
    <div>
      <div class="eyebrow">MongoDB · historico_vuelos</div>
      <h1 data-i18n="hi.h1">Historial de posiciones</h1>
      <p data-i18n="hi.lead">Las 100 posiciones más recientes guardadas en la base de datos.</p>
    </div>
    <div class="tools">
      <div class="field">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <label class="sr-only" for="filtro" data-i18n="hi.filterLabel">Filtrar registros</label>
        <input id="filtro" name="filtro" class="input" type="search" placeholder="Filtrar por vuelo o país…" data-i18n-placeholder="hi.filterPh" autocomplete="off" spellcheck="false">
      </div>
      <button id="btn-refresh" class="btn" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        <span data-i18n="hi.refresh">Refrescar</span>
      </button>
    </div>
  </div>

  <section class="panel hist" data-i18n-aria="hi.aria" aria-label="Registros" data-enter="2">
    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th scope="col" data-i18n="hi.thDate">Fecha y hora</th>
            <th scope="col">ICAO24</th>
            <th scope="col" data-i18n="hi.thFlight">Vuelo</th>
            <th scope="col" data-i18n="hi.thCountry">País de matrícula</th>
            <th scope="col" class="r" data-i18n="hi.thAlt">Altitud</th>
            <th scope="col" class="r" data-i18n="hi.thVel">Velocidad</th>
          </tr>
        </thead>
        <tbody id="tabla-cuerpo">
          <tr><td colspan="6"><div class="empty" data-i18n="hi.loading">Consultando la base de datos…</div></td></tr>
        </tbody>
      </table>
    </div>
    <div class="foot" aria-live="polite"><span id="foot-l"></span><span id="foot-r"></span></div>
  </section>
</main>


  
  <script src="static/js/i18n.js"></script>
  <script src="static/js/common.js"></script>
  
<script>
  const { t, esc, fmt, altColor, getJSON, estado } = Radar;
  let datos = [], leido = null, error = false, primera = true;

  function pintar() {
    const tbody = document.getElementById('tabla-cuerpo');
    if (error) {
      estado(t('live.offline'), 'err');
      tbody.innerHTML = `<tr><td colspan="6"><div class="empty"><strong>${t('st.err')}</strong>${t('hi.errTip')}</div></td></tr>`;
      return;
    }
    const q = document.getElementById('filtro').value.trim().toLowerCase();
    const filas = q ? datos.filter((v) => `${v.callsign} ${v.icao24} ${v.pais} ${I18n.pais(v.pais)}`.toLowerCase().includes(q)) : datos;
    document.getElementById('foot-l').textContent = q
      ? t('hi.of', { a: fmt.int(filas.length), b: fmt.int(datos.length) })
      : t('unit.records', { n: fmt.int(datos.length) });
    document.getElementById('foot-r').textContent = leido ? t('hi.read', { h: fmt.hora(leido) }) : '';
    estado(t('live.records', { n: fmt.int(datos.length) }), datos.length ? 'on' : '');
    if (!filas.length) {
      tbody.innerHTML = `<tr><td colspan="6"><div class="empty">${datos.length
        ? `<strong>${t('idx.noMatch')}</strong>${t('hi.noMatchTip')}`
        : `<strong>${t('st.empty')}</strong>${t('hi.emptyTip')}`}</div></td></tr>`;
      return;
    }
    // Animación escalonada solo en la primera carga
    tbody.innerHTML = filas.map((v, i) => `
      <tr style="${primera && i < 16 ? `animation-delay:${i * 25}ms` : 'animation:none'}">
        <td class="mono muted">${fmt.fecha(v.timestamp)}</td>
        <td><span class="tag" translate="no">${esc(v.icao24)}</span></td>
        <td class="mono" style="font-weight:600" translate="no">${esc(v.callsign)}</td>
        <td>${esc(I18n.pais(v.pais))}</td>
        <td class="r mono"><span class="alt-pill">${fmt.alt(v.altitud)}<i style="background:${altColor(v.altitud, v.en_tierra)}" aria-hidden="true"></i></span></td>
        <td class="r mono muted">${fmt.vel(v.velocidad)}</td>
      </tr>`).join('');
    primera = false;
  }

  async function cargar() {
    const btn = document.getElementById('btn-refresh');
    btn.disabled = true; btn.classList.add('loading');
    try {
      datos = await getJSON('/api/historial_datos');
      error = false;
      leido = new Date();
    } catch (e) {
      error = true;
    } finally {
      btn.disabled = false; btn.classList.remove('loading');
    }
    pintar();
  }

  document.getElementById('btn-refresh').addEventListener('click', cargar);
  document.getElementById('filtro').addEventListener('input', pintar);
  document.addEventListener('langchange', pintar);
  document.addEventListener('themechange', pintar);
  cargar();
</script>

</body>
</html>
