<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Logistics Tracker | Filtro por País</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { background-color: #f4f7f6; font-family: 'Inter', sans-serif; }
        .nav-custom { background: #1a1c23; padding: 1rem; color: white; }
        #map { height: 600px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .filter-card { background: white; border-radius: 15px; padding: 20px; border: none; }
    </style>
</head>
<body>
    <nav class="nav-custom mb-4">
        <div class="container d-flex justify-content-between">
            <span class="fs-4">✈️ Radar <span class="text-primary">Regional</span></span>
            <a href="/estadisticas" class="btn btn-outline-light btn-sm">Ver Estadísticas</a>
        </div>
    </nav>

    <div class="container">
        <div class="row g-4">
            <div class="col-md-3">
                <div class="filter-card shadow-sm">
                    <label class="form-label fw-bold">Seleccionar País:</label>
                    <select id="selector-pais" class="form-select mb-3" onchange="filtrarVuelos()">
                        <option value="todos">Todos los países</option>
                        <!-- Se llena dinámicamente -->
                    </select>
                    <div id="info-filtro" class="text-muted small">
                        Cargando países activos...
                    </div>
                </div>
            </div>
            <div class="col-md-9">
                <div id="map"></div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map').setView([-15, -60], 4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    const markersGroup = L.layerGroup().addTo(map);

    // 1. Cargamos los países disponibles desde el historial de la BD al iniciar
    async function cargarListaPaises() {
        try {
            const response = await fetch('/api/top_paises'); // Usamos este endpoint para ver qué países tienen datos
            const datosPaises = await response.json();
            const selector = document.getElementById('selector-pais');
            
            datosPaises.forEach(p => {
                const option = document.createElement('option');
                option.value = p._id; // El nombre del país
                option.textContent = `${p._id} (${p.total} registros)`;
                selector.appendChild(option);
            });
            document.getElementById('info-filtro').innerText = "Países cargados desde la base de datos.";
        } catch (e) { console.error("Error cargando lista:", e); }
    }

    // 2. Función principal para filtrar consultando a la API de MongoDB
    async function filtrarVuelos() {
        const paisSeleccionado = document.getElementById('selector-pais').value;
        const info = document.getElementById('info-filtro');
        markersGroup.clearLayers();

        // Si es "todos", usamos el endpoint de historial general, si no, el de filtro por país
        const url = paisSeleccionado === "todos" 
            ? '/api/historial_datos' 
            : `/api/vuelos_por_pais?pais=${encodeURIComponent(paisSeleccionado)}`;

        try {
            const response = await fetch(url);
            const vuelos = await response.json();

            vuelos.forEach(v => {
                if (v.latitud && v.longitud) {
                    L.marker([v.latitud, v.longitud])
                     .bindPopup(`<b>${v.callsign}</b><br>País: ${v.pais}<br>Fecha: ${v.timestamp}`)
                     .addTo(markersGroup);
                }
            });

            info.innerHTML = `Encontrados <b>${vuelos.length}</b> registros en la base de datos para <b>${paisSeleccionado}</b>.`;
        } catch (error) {
            info.innerHTML = "<span class='text-danger'>Error al conectar con la base de datos.</span>";
        }
    }

    // Ejecución inicial
    cargarListaPaises();
    filtrarVuelos();
</script>
</body>
</html>
