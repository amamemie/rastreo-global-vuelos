<!DOCTYPE html>
<html lang="es" data-theme="dark" data-static="1">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    /* Tema e idioma antes de pintar: sin parpadeo */
    (function () {
      var d = document.documentElement, t = null, l = null;
      try { t = localStorage.getItem('radar-theme'); l = localStorage.getItem('radar-lang'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      if (l !== 'es' && l !== 'en') l = /^es\b/i.test(navigator.language || '') ? 'es' : 'en';
      d.dataset.theme = t;
      if (l !== 'es') { d.lang = l; d.classList.add('i18n-pending'); setTimeout(function () { d.classList.remove('i18n-pending'); }, 1500); }
    })();
  </script>
  <meta name="theme-color" content="#06080b">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Rastreo en tiempo real del tráfico aéreo sobre Latinoamérica con datos de OpenSky Network. Real-time air traffic over Latin America.">
  <title data-i18n-key="idx.title">Radar en vivo · Radar Latam</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='11' fill='%2306080b' stroke='%23f5a524' stroke-width='1.5'/%3E%3Cpath d='M12 12L12 2A10 10 0 0 1 21 8z' fill='%23f5a524'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">

  <link rel="stylesheet" href="static/css/app.css">
  
<style>
  .radar {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 390px;
    height: calc(100dvh - var(--topbar-h));
  }
  .radar-map { position: relative; min-height: 0; overflow: hidden; }
  .legend-box { left: 14px; bottom: 30px; }
  .legend-box .eyebrow { margin-bottom: 8px; }

  .side {
    display: flex; flex-direction: column; min-height: 0;
    border-left: 1px solid var(--line);
    background: var(--surface);
  }
  .hero-count { padding: 26px 22px 20px; border-bottom: 1px solid var(--line); }
  .hero-count h1 { font: 600 12.5px/1 var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
  .count {
    margin: 12px 0 6px;
    font: 700 84px/.86 var(--font-display);
    letter-spacing: .01em;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(180deg, var(--ink) 30%, color-mix(in srgb, var(--ink) 55%, transparent));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .count-sub { color: var(--ink-2); font-size: 14px; }
  .side .kpis { border-bottom: 1px solid var(--line); }
  .side .kpi { padding: 14px 16px; }
  .side .kpi-value { font-size: 22px; }
  .actions { padding: 18px 22px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
  .actions .hint { font-size: 12.5px; color: var(--ink-3); }
  .actions .hint.err { color: var(--err); }
  .snapshot {
    display: grid; gap: 6px; padding: 12px 14px;
    border: 1px solid var(--line-strong); border-left: 2px solid var(--accent);
    border-radius: var(--r-sm); background: var(--surface-2);
    font-size: 13.5px; color: var(--ink-2);
  }
  .snapshot b { color: var(--ink); font-weight: 500; }

  .list-head { padding: 16px 22px 12px; display: grid; gap: 12px; }
  .list-head .row { display: flex; justify-content: space-between; align-items: baseline; }
  .flights { list-style: none; margin: 0; padding: 0 10px 12px; overflow-y: auto; flex: 1; min-height: 0; overscroll-behavior: contain; }
  .flights li { content-visibility: auto; contain-intrinsic-size: auto 54px; }
  .flight {
    width: 100%;
    display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: center; gap: 12px;
    padding: 10px 12px;
    background: none; border: 0; border-radius: var(--r-sm);
    text-align: left; cursor: pointer;
    transition: background-color .15s var(--ease), transform .15s var(--ease);
  }
  .flight:hover { background: var(--surface-2); transform: translateX(2px); }
  .flight[aria-pressed="true"] { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
  .flight i { width: 8px; height: 8px; border-radius: 50%; }
  .flight .cs { font: 600 14px/1.2 var(--font-mono); letter-spacing: .02em; }
  .flight .pa { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .flight .al { font: 500 13px/1 var(--font-mono); font-variant-numeric: tabular-nums; color: var(--ink-2); text-align: right; }

  @media (max-width: 960px) {
    .radar { grid-template-columns: 1fr; height: auto; }
    .radar-map { height: 64dvh; }
    .side { border-left: 0; border-top: 1px solid var(--line); }
    .flights { max-height: 60dvh; }
    .count { font-size: 64px; }
    .legend-box { left: auto; right: 8px; top: 8px; bottom: auto; padding: 8px 10px; max-width: 190px; }
    .legend-box .eyebrow { display: none; }
    .legend { font-size: 11px; gap: 4px 10px; }
  }
</style>

</head>
<body>
  <a class="skip-link" href="#main" data-i18n="skip">Saltar al contenido</a>

  <header class="topbar">
    <a class="brand" href="index.html" translate="no" data-i18n-aria="brand.aria" aria-label="Radar Latam, inicio">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="10.5" stroke="var(--line-strong)"/>
        <circle cx="12" cy="12" r="6" stroke="var(--line-strong)"/>
        <g class="sweep"><path d="M12 12L12 1.5A10.5 10.5 0 0 1 21.1 6.75z" fill="url(#sw)"/></g>
        <circle cx="12" cy="12" r="1.6" fill="var(--accent)"/>
        <defs><linearGradient id="sw" x1="12" y1="2" x2="20" y2="8" gradientUnits="userSpaceOnUse"><stop stop-color="#f5a524" stop-opacity=".9"/><stop offset="1" stop-color="#f5a524" stop-opacity="0"/></linearGradient></defs>
      </svg>
      Radar <span>Latam</span>
    </a>
    
    <nav class="nav" data-i18n-aria="nav.aria" aria-label="Secciones">
      <a href="index.html" data-i18n="nav.radar" aria-current="page">Radar en vivo</a>
      <a href="filtro_paises.html" data-i18n="nav.filtro" >Por país</a>
      <a href="estadisticas.html" data-i18n="nav.stats" >Estadísticas</a>
      <a href="historial.html" data-i18n="nav.hist" >Historial</a>
    </nav>
    <div class="tools-bar">
      <div class="live" aria-live="polite">
        <span id="live-dot" class="dot" aria-hidden="true"></span>
        <span id="live-text" data-i18n="live.connecting">Conectando…</span>
      </div>
      <div class="seg" role="group" data-i18n-aria="lang.aria" aria-label="Idioma">
        <button type="button" data-lang-btn="es" aria-pressed="true" lang="es">ES</button>
        <button type="button" data-lang-btn="en" aria-pressed="false" lang="en">EN</button>
      </div>
      <button type="button" id="theme-btn" class="icon-btn" aria-label="Cambiar tema">
        <svg class="i-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.2M12 19.8V22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M2 12h2.2M19.8 12H22M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"/></svg>
        <svg class="i-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z"/></svg>
      </button>
    </div>
  </header>

  
<main id="main" class="radar">
  <section class="radar-map" data-i18n-aria="idx.mapAria" aria-label="Mapa de tráfico aéreo en 3D">
    <div id="map" class="map"></div>
    <div class="map-overlay legend-box" data-enter="3">
      <div class="eyebrow" data-i18n="idx.legend">Altitud</div>
      <div class="legend">
        <span><i style="background:var(--alt-ground)"></i><span data-i18n="ground">En tierra</span></span>
        <span><i style="background:var(--alt-low)"></i><span data-i18n="idx.low">&lt; 4.000 m</span></span>
        <span><i style="background:var(--alt-mid)"></i><span data-i18n="idx.mid">&lt; 9.000 m</span></span>
        <span><i style="background:var(--alt-high)"></i><span data-i18n="idx.high">Crucero</span></span>
      </div>
    </div>
  </section>

  <aside class="side" data-i18n-aria="idx.panelAria" aria-label="Panel de control">
    <div class="hero-count" data-enter>
      <h1 data-i18n="idx.h1">Aeronaves en el aire</h1>
      <div class="count" id="flight-count">0</div>
      <p class="count-sub" data-i18n="idx.sub">sobre Latinoamérica, entre 55° S y 15° N</p>
    </div>

    <div class="kpis" data-enter="2">
      <div class="kpi"><div class="eyebrow" data-i18n="idx.kAlt">Alt. media</div><div class="kpi-value" id="kpi-alt">—</div></div>
      <div class="kpi"><div class="eyebrow" data-i18n="idx.kPais">País líder</div><div class="kpi-value" id="kpi-pais" style="font-size:18px">—</div></div>
      <div class="kpi"><div class="eyebrow" data-i18n="idx.kHora">Actualizado</div><div class="kpi-value" id="kpi-hora">—</div></div>
    </div>

    <div class="actions" data-enter="3">
      
      <div class="snapshot">
        <div class="eyebrow" data-i18n="idx.snapEyebrow">Instantánea</div>
        <p id="snap-text" data-ts="2026-11-22 10:39:29">2026-11-22 10:39:29</p>
      </div>
      
    </div>

    <div class="list-head">
      <div class="row">
        <h2 class="eyebrow" data-i18n="idx.flights">Vuelos</h2>
        <span class="eyebrow num" id="list-count"></span>
      </div>
      <div class="field">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <label class="sr-only" for="buscar" data-i18n="idx.searchLabel">Buscar vuelo</label>
        <input id="buscar" name="buscar" class="input" type="search" placeholder="Vuelo, ICAO o país…" data-i18n-placeholder="idx.searchPh" autocomplete="off" spellcheck="false">
      </div>
    </div>
    <ul class="flights" id="lista"></ul>
  </aside>
</main>


  
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>

  <script src="static/js/i18n.js"></script>
  <script src="static/js/common.js"></script>
  
<script>
  const { t, esc, fmt, altColor, hace, parseTs, crearMapa, capaAviones, marcarAvion, volarA, popupVuelo, popup, getJSON, estado, animarNumero } = Radar;
  const $ = (id) => document.getElementById(id);
  let vuelos = [];
  let porIcao = new Map();
  let seleccionado = null;
  let ultimaCarga = null;
  let errorCarga = false;
  const pop = popup();

  const map = crearMapa('map', {
    onStyle: (m) => { capaAviones(m, vuelos, { onClick: (icao) => seleccionar(icao, false) }); marcarAvion(m, seleccionado); },
  });

  function seleccionar(icao, volar = true) {
    seleccionado = icao;
    const v = porIcao.get(icao);
    marcarAvion(map, icao);
    document.querySelectorAll('.flight[aria-pressed="true"]').forEach((b) => b.setAttribute('aria-pressed', 'false'));
    document.querySelector(`.flight[data-icao="${CSS.escape(icao)}"]`)?.setAttribute('aria-pressed', 'true');
    if (!v) return;
    const ll = [v.longitud, v.latitud];
    if (volar) volarA(map, ll);
    pop.setLngLat(ll).setHTML(popupVuelo(v)).addTo(map);
  }

  function pintarLista() {
    const q = $('buscar').value.trim().toLowerCase();
    const filtrados = q
      ? vuelos.filter((v) => `${v.callsign} ${v.icao24} ${v.pais} ${I18n.pais(v.pais)}`.toLowerCase().includes(q))
      : vuelos;
    $('list-count').textContent = q ? t('idx.of', { a: fmt.int(filtrados.length), b: fmt.int(vuelos.length) }) : fmt.int(vuelos.length);
    if (errorCarga) {
      $('lista').innerHTML = `<li class="empty"><strong>${t('idx.noServer')}</strong>${t('idx.noServerTip')}</li>`;
      return;
    }
    if (!filtrados.length) {
      $('lista').innerHTML = vuelos.length
        ? `<li class="empty"><strong>${t('idx.noMatch')}</strong>${t('idx.noMatchTip')}</li>`
        : `<li class="empty"><strong>${t('idx.noCache')}</strong>${t('idx.noCacheTip')}</li>`;
      return;
    }
    $('lista').innerHTML = filtrados.map((v) => {
      const cs = v.callsign !== 'N/A' ? v.callsign : v.icao24.toUpperCase();
      return `<li><button type="button" class="flight" data-icao="${esc(v.icao24)}" aria-pressed="${v.icao24 === seleccionado}">
        <i style="background:${altColor(v.altitud, v.en_tierra)}" aria-hidden="true"></i>
        <span style="min-width:0"><div class="cs" translate="no">${esc(cs)}</div><div class="pa">${esc(I18n.pais(v.pais))}</div></span>
        <span class="al">${v.altitud ? fmt.int(v.altitud) + ' m' : t('ground.short')}</span>
      </button></li>`;
    }).join('');
  }

  function pintarKpis() {
    animarNumero($('flight-count'), vuelos.length);
    const enAire = vuelos.filter((v) => v.altitud > 0);
    $('kpi-alt').innerHTML = enAire.length
      ? `${fmt.int(enAire.reduce((a, v) => a + v.altitud, 0) / enAire.length)}<small>m</small>` : '—';
    const porPais = {};
    vuelos.forEach((v) => { porPais[v.pais] = (porPais[v.pais] || 0) + 1; });
    const top = Object.entries(porPais).sort((a, b) => b[1] - a[1])[0];
    $('kpi-pais').textContent = top ? I18n.pais(top[0]) : '—';
    $('kpi-pais').title = top ? `${I18n.pais(top[0])}: ${t('idx.flightsN', { n: top[1] })}` : '';
    ultimaCarga = parseTs(vuelos.map((v) => v.timestamp).sort().pop());
    $('kpi-hora').textContent = fmt.hora(ultimaCarga);
    $('kpi-hora').title = ultimaCarga ? hace(ultimaCarga) : '';
  }

  function pintarEstado() {
    if (errorCarga) return estado(t('live.offline'), 'err');
    estado(vuelos.length ? t(Radar.STATIC ? 'live.snapshot' : 'live.live', { n: fmt.int(vuelos.length) }) : t('live.empty'), vuelos.length ? 'on' : '');
  }

  function pintarSnapshot() {
    const el = $('snap-text');
    if (el) el.innerHTML = t('idx.snapText', { fecha: `<b class="mono">${esc(fmt.fecha(el.dataset.ts))}</b>` });
  }

  async function cargar() {
    try {
      const datos = await getJSON('/api/vuelos');
      errorCarga = false;
      vuelos = datos.filter((v) => v.latitud != null && v.longitud != null)
                    .sort((a, b) => (b.altitud || 0) - (a.altitud || 0));
      porIcao = new Map(vuelos.map((v) => [v.icao24, v]));
      if (map.getSource('vuelos')) capaAviones(map, vuelos);  // si no, onStyle la crea con estos datos
      pintarKpis();
    } catch (e) {
      errorCarga = true;
    }
    pintarLista();
    pintarEstado();
  }

  async function actualizar() {
    const btn = $('btn-sync'), hint = $('sync-hint'), label = btn.querySelector('span');
    btn.disabled = true; btn.classList.add('loading');
    label.textContent = t('idx.btnLoading');
    hint.className = 'hint'; hint.textContent = t('idx.downloading');
    try {
      const r = await getJSON('/api/actualizar_vuelos', { method: 'POST' });
      if (r.status !== 'success') throw new Error(r.message);
      await cargar();
      hint.textContent = r.cached ? t('idx.cached', { s: r.espera ?? '…' }) : t('idx.saved', { n: fmt.int(r.count) });
    } catch (e) {
      hint.className = 'hint err';
      hint.textContent = t('idx.error', { msg: e.message || 'Error' });
    } finally {
      btn.disabled = false; btn.classList.remove('loading');
      label.textContent = t('idx.btn');
    }
  }

  $('btn-sync')?.addEventListener('click', actualizar);
  $('buscar').addEventListener('input', pintarLista);
  $('lista').addEventListener('click', (e) => {
    const b = e.target.closest('.flight');
    if (b) seleccionar(b.dataset.icao);
  });
  document.addEventListener('langchange', () => {
    pintarKpis(); pintarLista(); pintarEstado(); pintarSnapshot();
    if (seleccionado && pop.isOpen()) pop.setHTML(popupVuelo(porIcao.get(seleccionado)));
  });
  document.addEventListener('themechange', pintarLista);

  pintarSnapshot();
  cargar();
  if (!Radar.STATIC) setInterval(cargar, 30000);  // refresca desde Redis (lo que capture el ingestor)
</script>

</body>
</html>
