<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Logistics Analytics | Top Países</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        .nav-custom { background: #1a1c23; padding: 1rem; margin-bottom: 2rem; }
        #map-stats { 
            height: 550px; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            border: 1px solid #dee2e6;
        }
        .card-stats { border: none; border-radius: 15px; background: white; padding: 25px; height: 100%; }
        .list-group-item { 
            transition: all 0.2s; 
            border-radius: 8px !important; 
            margin-bottom: 5px; 
            border: 1px solid transparent;
            cursor: pointer;
        }
        .list-group-item:hover { background-color: #f8f9fa; border-color: #dee2e6; transform: translateX(5px); }
        /* Clase para resaltar el país seleccionado en la lista */
        .item-active { border-color: #0d6efd !important; background-color: #e7f1ff !important; font-weight: bold; }
        .badge-count { border-radius: 8px; padding: 5px 12px; font-weight: bold; }
    </style>
</head>
<body>

    <nav class="nav-custom text-white shadow-sm">
        <div class="container d-flex justify-content-between align-items-center">
            <span class="fs-4 fw-bold">✈️ Logistics<span class="text-primary">Analytics</span></span>
            <div class="d-flex gap-2">
                <a href="/" class="btn btn-primary btn-sm">📡 Radar en Vivo</a>
                <a href="historial.html" class="btn btn-outline-light btn-sm">📋 Historial</a>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="row g-4">
            <div class="col-lg-8">
                <div class="card-stats shadow-sm">
                    <h5 class="fw-bold mb-3">Localización por País</h5>
                    <div id="map-stats"></div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card-stats shadow-sm">
                    <h5 class="fw-bold mb-4">Top 10 Orígenes</h5>
                    <p class="text-muted small">Haz clic en un país para localizarlo en el mapa.</p>
                    <div id="lista-paises" class="list-group list-group-flush">
                        <div class="text-center py-4 text-muted small">Cargando datos...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map-stats').setView([-10, -55], 3);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        
        // Capa para los marcadores (limpiar antes de mostrar uno nuevo)
        const markerGroup = L.layerGroup().addTo(map);

        // Paleta de colores distintos para cada país
        const colores = [
            '#FF5733', '#33FF57', '#3357FF', '#F333FF', '#FF33A1', 
            '#33FFF5', '#F5FF33', '#FF8C33', '#8C33FF', '#33FF8C'
        ];

        async function cargarAnalytics() {
            try {
                const response = await fetch('/api/top_paises');
                const data = await response.json();
                const lista = document.getElementById('lista-paises');
                
                lista.innerHTML = ''; 

                if (data.length === 0) {
                    lista.innerHTML = '<div class="alert alert-info">Sin datos.</div>';
                    return;
                }

                data.forEach((p, index) => {
                    const colorPais = colores[index % colores.length];
                    
                    // Crear el elemento de la lista
                    const item = document.createElement('div');
                    item.className = 'list-group-item d-flex justify-content-between align-items-center px-3';
                    item.innerHTML = `
                        <span>🌍 ${p._id || 'Desconocido'}</span>
                        <span class="badge-count" style="background-color: ${colorPais}22; color: ${colorPais}">${p.total}</span>
                    `;

                    // EVENTO: Mostrar en mapa al seleccionar
                    item.onclick = () => {
                        // 1. Limpiar mapa y selección previa
                        markerGroup.clearLayers();
                        document.querySelectorAll('.list-group-item').forEach(i => i.classList.remove('item-active'));
                        
                        // 2. Resaltar item actual
                        item.classList.add('item-active');

                        // 3. Dibujar círculo en el mapa
                        if (p.lat && p.lon) {
                            const radius = Math.max(10, Math.sqrt(p.total) * 4);
                            const circle = L.circleMarker([p.lat, p.lon], {
                                radius: radius,
                                color: colorPais,
                                fillColor: colorPais,
                                fillOpacity: 0.6,
                                weight: 3
                            }).addTo(markerGroup);

                            circle.bindPopup(`<b>${p._id}</b><br>Registros: ${p.total}`).openPopup();
                            
                            // Centrar mapa suavemente
                            map.flyTo([p.lat, p.lon], 4);
                        }
                    };

                    lista.appendChild(item);
                });
            } catch (error) {
                console.error("Error:", error);
            }
        }

        cargarAnalytics();
    </script>
</body>
</html>
